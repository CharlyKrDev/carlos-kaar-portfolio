<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="robots" content="noindex" />

  <title>404 | Carlos Alberto Kaar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #020617;
      color: #f1f5f9;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 640px;
      border: 1px solid #334155;
      padding: 40px;
    }

    .code {
      margin: 0 0 12px;
      color: #a78bfa;
      font-family: monospace;
      font-size: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 4rem);
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 16px;
      color: #2dd4bf;
      font-family: monospace;
      text-decoration: none;
    }

    a:hover {
      color: #5eead4;
    }
  </style>
</head>

<body>
  <main>
    <p class="code">&gt;_ ERROR 404</p>

    <h1>Page not found.</h1>

    <p>
      The requested resource does not exist or may have been moved.
    </p>

    <a href="/">
      &gt; return home
    </a>
  </main>
</body>
</html>
